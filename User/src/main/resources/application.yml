server:
  port: 8081

spring:
  application:
    name: USER-SERVICE

  datasource:
    #url: jdbc:mysql://localhost:3305/user_moto_insurance   # docker DB # DB in Docker -> create jar use "mysql-docker" container name insted "localhost"
    url: jdbc:mysql://localhost:3306/use_moto_insurance   #  local DB
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  # ✅ CACHE CONFIG
  cache:
    type: redis

  # ✅ REDIS CONFIG
  data:
    redis:
      host: localhost
      port: 6379
      time-to-live: 10m

# Prometheus monitoring configuration
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      resilience4j.circuitbreaker.calls: true


# ✅ Eureka configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


# Kafka file

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      userPolicyBreaker:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 5
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 10s
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: COUNT_BASED

# AOP loggingg
logging:
  level:
    root: INFO
    com.example.evstation: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"