server:
  port: 8085

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
             - Path=/auth/**

        - id: user-service
          uri: lb://user-service    # http://localhost:8081
          predicates:
            - Path=/users/**,/admin/**,/test/**


        - id: drivinghistory-service
          uri: lb://drivinghistory-service
          predicates:
            - Path=/driving-history/**

        - id:  policy-service
          uri: lb://policy-service
          predicates:
            - Path=/policies/**

        - id: claim-service
          uri: lb://claim-service
          predicates:
            - Path=/claims/**



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
